<style>
.notes-container{
  max-width: 900px;
  margin: 30px auto;
  padding: 20px;
}

.note-card{
  background: rgba(255,255,255,0.05);
  border: 1px solid #00f0ff;
  padding: 15px;
  margin: 10px 0;
  border-radius: 10px;
  backdrop-filter: blur(10px);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.note-title{
  color: #00f0ff;
  font-weight: bold;
}

.note-btn{
  padding: 8px 12px;
  background: #00f0ff;
  border: none;
  cursor: pointer;
  font-weight: bold;
  transition: 0.3s;
}

.note-btn:hover{
  box-shadow: 0 0 15px #00f0ff;
}
</style>

</head>
