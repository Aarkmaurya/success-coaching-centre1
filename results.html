<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Results | SUCCESS COACHING CENTRE</title>

<link rel="stylesheet" href="style.css">

<style>
.results-container{
  max-width: 900px;
  margin: 30px auto;
  padding: 20px;
}

.result-card{
  background: rgba(255,255,255,0.05);
  border: 1px solid #00f0ff;
  padding: 15px;
  margin: 10px 0;
  border-radius: 10px;
  backdrop-filter: blur(10px);
  transition: 0.3s;
}

.result-card:hover{
  box-shadow: 0 0 20px #00f0ff;
  transform: scale(1.02);
}

.score{
  color: #00f0ff;
  font-size: 20px;
  font-weight: bold;
}

.stats{
  display: flex;
  justify-content: space-between;
  margin-top: 10px;
  flex-wrap: wrap;
}

.stat{
  padding: 10px;
  margin: 5px;
  border: 1px solid rgba(0,255,255,0.3);
  border-radius: 8px;
  min-width: 120px;
  text-align: center;
}
</style>

</head>

<body>

<!-- NAV -->
<div class="nav">
  <a href="dashboard.html">Dashboard</a>
  <a href="tests.html">Tests</a>
  <a href="notes.html">Notes</a>
  <a href="profile.html">Profile</a>
  <a href="results.html">Results</a>
  <a href="leaderboard.html">Leaderboard</a>
  <a href="admin.html">Admin</a>
</div>

<!-- RESULTS -->
<div class="results-container">

  <h2>📊 Your Performance</h2>

  <!-- RESULT CARD 1 -->
  <div class="result-card">

    <div class="score">Score: 42 / 50</div>

    <div class="stats">

      <div class="stat">
        <b>Accuracy</b><br>
        84%
      </div>

      <div class="stat">
        <b>Correct</b><br>
        42
      </div>

      <div class="stat">
        <b>Wrong</b><br>
        8
      </div>

      <div class="stat">
        <b>Time</b><br>
        28 min
      </div>

    </div>

  </div>

  <!-- RESULT CARD 2 -->
  <div class="result-card">

    <div class="score">Score: 38 / 50</div>

    <div class="stats">

      <div class="stat">
        <b>Accuracy</b><br>
        76%
      </div>

      <div class="stat">
        <b>Correct</b><br>
        38
      </div>

      <div class="stat">
        <b>Wrong</b><br>
        12
      </div>

      <div class="stat">
        <b>Time</b><br>
        30 min
      </div>

    </div>

  </div>

</div>

<!-- FIREBASE -->
<script type="module" src="firebase-config.js"></script>
<script type="module" src="app.js"></script>

</body>
</html>
